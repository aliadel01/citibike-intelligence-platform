version: 2

# Note: Schema changed in 2021
# - Old schema (2013-2020): Has bike_id, birth_year, gender, usertype
# - New schema (2021 (month 2) +): Has member_casual (usertype in old schema), rideable_type, NO bike_id/birth_year/gender
# but we will only work with (2021+) schema for this project, so we can ignore the old columns

sources:
  - name: external
    description: "External tables pointing to ADLS Gen2 bronze layer"
    database: CITIBIKE_DB
    schema: EXTERNAL
    
    tables:
      # =====================================
      # Trips External Table
      # =====================================
      - name: v_trips_raw
        freshness:
            warn_after: {count: 33, period: day}
            error_after: {count: 35, period: day}
        loaded_at_field: started_at
        
        description: |
          Raw Citibike trip data from CSV files in ADLS Gen2.
          Data schema changed in 2021 - older files may have different columns.
        external:
          location: "@BRONZE_STAGE/trip_data_validated"
          file_format: CSV_FORMAT
          pattern: ".*\\.csv"

        columns:
          - name: ride_id
            data_type: VARCHAR
            description: "Unique trip identifier (maps to trip_id)"
            tests:
              - not_null

          - name: rideable_type
            data_type: VARCHAR
            description: "Bike type: electric_bike, classic_bike, docked_bike"

          - name: started_at
            data_type: TIMESTAMP_NTZ
            expression: "TRY_TO_TIMESTAMP(REGEXP_REPLACE(value:c3::varchar, '^\"|\"$', ''))"
            description: "Trip start timestamp (maps to start_time)"
            tests:
              - not_null

          - name: ended_at
            data_type: TIMESTAMP_NTZ
            expression: "TRY_TO_TIMESTAMP(REGEXP_REPLACE(value:c3::varchar, '^\"|\"$', ''))"
            description: "Trip end timestamp (maps to stop_time)"
            tests:
              - not_null

          - name: start_station_name
            data_type: VARCHAR
            description: "Starting station name (maps to 'name' in dim_station)"
            tests:
              - not_null

          - name: start_station_id
            data_type: VARCHAR
            description: "Starting station ID (VARCHAR)"
            tests:
              - not_null

          - name: end_station_name
            data_type: VARCHAR
            description: "Ending station name (maps to 'name' in dim_station)"

          - name: end_station_id
            data_type: VARCHAR
            description: "Ending station ID (VARCHAR)"

          - name: start_lat
            data_type: FLOAT
            expression: "TRY_CAST(value:c9::varchar AS FLOAT)"
            description: "Starting station latitude (maps to 'lat')"
            tests:
              - not_null

          - name: start_lng
            data_type: FLOAT
            expression: "TRY_CAST(value:c9::varchar AS FLOAT)"
            description: "Starting station longitude (maps to 'lon')"
            tests:
              - not_null

          - name: end_lat
            data_type: FLOAT
            expression: "TRY_CAST(value:c9::varchar AS FLOAT)"
            description: "Ending station latitude (maps to 'lat')"

          - name: end_lng
            data_type: FLOAT
            expression: "TRY_CAST(value:c9::varchar AS FLOAT)"
            description: "Ending station longitude (maps to 'lon')"  

          - name: member_casual
            data_type: VARCHAR
            description: "User type (new schema): member or casual"
            tests:
              - accepted_values:
                  values: ['member', 'casual']
                  quote: true
                  config:
                    severity: warn
            
        
      
      # =====================================
      # Station Metadata External Table
      # =====================================
      - name: v_station_metadata
        external:
          location: "@BRONZE_STAGE/station_metadata_validated"
          file_format: JSON_FORMAT
          pattern: ".*\\.json"